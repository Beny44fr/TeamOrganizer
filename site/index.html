<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestion de l'équipe de basket</title>
<meta name="description" content="Convocations, roulements de transport, bar et maillots, suivi de l'équité entre familles. Les données restent sur l'appareil.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#14171C" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon équipe">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html,body{margin:0;padding:0;background:#F7F8FA}
  @media (prefers-color-scheme:dark){html,body{background:#14171C}}
</style>
</head>
<body>
<div id="app"></div>

<style>
  :root{
    color-scheme:light;
    --acc:#FF6B1A; --acc-d:#E2560B; --acc-s:rgba(255,107,26,.12); --acc-on:#fff;
    --ok:#2FA96A; --ok-d:#1E7A4B; --warn:#C88A12; --bad:#E5484D;
    --t1:#16181C; --t2:#5E6470; --t3:#9096A2;
    --hair:rgba(20,24,33,.10); --hair-2:rgba(20,24,33,.055);
    --ink5:rgba(20,24,33,.05); --ink7:rgba(20,24,33,.07);
    --s1:rgba(255,255,255,.74);   /* surface principale, translucide */
    --s2:rgba(255,255,255,.52);   /* surface secondaire */
    --s3:#fff;                    /* champs et éléments posés dessus */
    --s-solid:#FCFDFD;            /* colonnes figées, listes */
    --sheet:#F4F6F8;
    --blur:saturate(180%) blur(24px);
    --r:18px; --r-s:13px; --tap:46px;
    --sab:env(safe-area-inset-bottom,0px);
    --sh-1:0 1px 2px rgba(20,24,33,.05);
    --sh-2:0 2px 6px -2px rgba(20,24,33,.10), 0 10px 28px -14px rgba(20,24,33,.22);
    --sh-3:0 8px 30px rgba(20,24,33,.20);
    --bg:
      radial-gradient(1000px 520px at 10% -10%, rgba(255,138,61,.16), transparent 62%),
      radial-gradient(820px 480px at 98% 2%, rgba(90,160,255,.14), transparent 64%),
      linear-gradient(180deg,#F7F8FA 0%,#EFF1F4 100%);
  }
  @media (prefers-color-scheme:dark){
    :root{
      color-scheme:dark;
      --acc:#FF7A33; --acc-d:#FF9457; --acc-s:rgba(255,122,51,.16); --acc-on:#20120A;
      --ok:#3ECF8E; --ok-d:#5FE0A6; --warn:#E5B23C; --bad:#FF6369;
      --t1:#F2F4F7; --t2:#A7AEBC; --t3:#767D8C;
      --hair:rgba(255,255,255,.13); --hair-2:rgba(255,255,255,.075);
      --ink5:rgba(255,255,255,.06); --ink7:rgba(255,255,255,.09);
      --s1:rgba(38,42,50,.72); --s2:rgba(38,42,50,.46); --s3:#2C313A; --s-solid:#22262D;
      --sheet:#181B21;
      --sh-1:0 1px 2px rgba(0,0,0,.30);
      --sh-2:0 2px 8px -2px rgba(0,0,0,.42), 0 14px 32px -16px rgba(0,0,0,.6);
      --sh-3:0 10px 34px rgba(0,0,0,.55);
      --bg:
        radial-gradient(1000px 540px at 8% -12%, rgba(255,122,51,.15), transparent 60%),
        radial-gradient(820px 480px at 98% 0%, rgba(70,120,220,.16), transparent 62%),
        linear-gradient(180deg,#14171C 0%,#0F1216 100%);
    }
  }
  *{box-sizing:border-box}
  body{background:var(--bg);background-attachment:fixed;min-height:100dvh}
  @supports not (height:1dvh){body{min-height:100vh}}
  #app{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--t1);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased;
    max-width:920px;margin:0 auto;position:relative;
    padding-bottom:calc(100px + var(--sab));
  }
  #app h1,#app h2,#app h3{margin:0;font-weight:640;letter-spacing:-.022em}
  #app p{margin:0}
  #app button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
  #app a{color:var(--acc-d);text-decoration:none}
  .ic{flex:none;vertical-align:-3px}
  #app,.ov,.sheet,.toast{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  .ov,.sheet,.toast{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--t1);font-size:15.5px;line-height:1.45
  }
  /* 16px sur tout champ saisissable : seuil sous lequel iOS zoome au focus */
  #app input,#app select,#app textarea,
  .ov input,.ov select,.ov textarea,
  .f input,.f select,.f textarea,.crow input,.salle input,
  input[type=date],input[type=time],input[type=number],input[type=email],input[type=tel]{
    font-size:16px !important;line-height:1.35
  }
  #app input,#app select,#app textarea,.ov input,.ov select,.ov textarea{
    font-family:inherit;color:var(--t1);max-width:100%;min-width:0
  }
  #app button,#app label,.ov button,.ov label,.chip,.tab{touch-action:manipulation}

  /* ---------------- en-tête ---------------- */
  .top{padding:22px 18px 8px}
  .top h1{font-size:27px;letter-spacing:-.032em}
  .top .sub{font-size:13.5px;color:var(--t2);margin-top:3px}
  .wrap{padding:10px 18px 6px;animation:fade .22s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---------------- onglets ---------------- */
  .tabbar{
    position:sticky;top:8px;z-index:40;margin:6px 18px 6px;
    display:flex;gap:4px;padding:5px;border-radius:17px;
    background:var(--s1);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--hair);box-shadow:var(--sh-2)
  }
  .tab{
    flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:13px;
    padding:9px 2px;font-size:11.5px;font-weight:600;color:var(--t2);
    display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
    min-height:54px;justify-content:center;transition:color .16s,background .16s
  }
  .tab span:not(.bdg){overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tab[aria-selected="true"]{background:var(--s3);color:var(--acc-d);box-shadow:var(--sh-1)}
  .tab .bdg{
    position:absolute;top:5px;right:calc(50% - 21px);background:var(--acc);color:var(--acc-on);
    border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;
    font-size:10.5px;font-weight:700;padding:0 4px
  }
  @media(max-width:720px){
    .tabbar{
      position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-radius:0;
      border:0;border-top:1px solid var(--hair);box-shadow:0 -1px 24px rgba(20,24,33,.10);
      padding:5px 6px calc(5px + var(--sab));gap:0;max-width:none
    }
    .tab{border-radius:11px;gap:2px;min-height:50px}
    .tab[aria-selected="true"]{background:transparent;color:var(--acc);box-shadow:none}
    .tab[aria-selected="true"]::after{
      content:'';position:absolute;top:2px;width:22px;height:3px;border-radius:2px;background:var(--acc)
    }
    .top{padding:18px 16px 2px}
    .top h1{font-size:25px}
    .wrap{padding:6px 16px}
  }

  /* ---------------- surfaces ---------------- */
  .card{
    background:var(--s1);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden
  }
  .card + .card{margin-top:12px}
  .card-h{padding:14px 16px;border-bottom:1px solid var(--hair-2);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .card-h h3{font-size:15px}
  .card-b{padding:16px}
  .muted{color:var(--t2);font-size:13.5px}
  .tiny{color:var(--t3);font-size:12.5px;line-height:1.45}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sec-title{
    font-size:12px;font-weight:700;color:var(--t3);margin:24px 0 10px;
    display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.055em
  }
  .sec-title .ic{color:var(--t3)}

  /* ---------------- prochain match ---------------- */
  .hero{
    border-radius:22px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;
    background:var(--s1);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--hair);box-shadow:var(--sh-2)
  }
  .hero::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(135deg,var(--acc-s),transparent 55%)
  }
  .hero > *{position:relative}
  .hero .lbl{font-size:11px;font-weight:700;color:var(--acc-d);text-transform:uppercase;letter-spacing:.08em}
  .hero h2{font-size:22px;margin-top:5px;letter-spacing:-.03em}
  .hero .when{font-size:13.5px;color:var(--t2);margin-top:3px}
  .hero .htimes{display:flex;gap:22px;margin-top:15px}
  .hero .htimes div span{display:block;font-size:11px;color:var(--t3);font-weight:640;text-transform:uppercase;letter-spacing:.05em}
  .hero .htimes div b{display:block;font-size:27px;font-variant-numeric:tabular-nums;letter-spacing:-.035em;line-height:1.1;margin-top:3px}
  .hero .htimes .hi b{color:var(--acc-d)}
  .hero .hact{display:flex;gap:8px;margin-top:16px}
  .hero .hact .btn{flex:1}

  /* ---------------- boutons ---------------- */
  .btn{
    background:var(--acc);color:var(--acc-on);border:0;border-radius:14px;
    padding:12px 16px;font-weight:640;font-size:14.5px;min-height:var(--tap);
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    box-shadow:var(--sh-1);transition:transform .12s,background .16s,opacity .16s
  }
  .btn:hover{background:var(--acc-d)}
  .btn:active{transform:scale(.972)}
  .btn.ghost{background:var(--s1);color:var(--t1);border:1px solid var(--hair);box-shadow:none;backdrop-filter:var(--blur)}
  .btn.ghost:hover{background:var(--s3)}
  .btn.sm{padding:8px 12px;font-size:13.5px;border-radius:11px;min-height:38px}
  .btn.danger{background:rgba(229,72,77,.10);color:var(--bad);border:1px solid rgba(229,72,77,.24);box-shadow:none}
  .btn.danger:hover{background:rgba(229,72,77,.16)}
  .btn.wide{width:100%}
  .btn:disabled{opacity:.45;pointer-events:none}
  .link{background:none;border:0;color:var(--acc-d);font-weight:620;padding:8px 0;font-size:14px;min-height:38px;display:inline-flex;align-items:center;gap:6px}
  .link:hover{text-decoration:underline}
  .link.subtle{color:var(--t2);font-weight:600;font-size:13.5px;gap:5px}
  .link.subtle:hover{color:var(--acc-d)}
  .btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.jchip:focus-visible,.seg button:focus-visible,
  .prow:focus-visible,.match:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--acc);outline-offset:2px
  }

  .actionbar{
    position:sticky;bottom:0;z-index:20;margin:18px -18px 0;
    padding:11px 18px calc(11px + var(--sab));
    background:var(--s1);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border-top:1px solid var(--hair);display:flex;gap:8px
  }
  .actionbar .btn{flex:1 1 auto}
  .actionbar .btn.ico{flex:0 0 52px;padding:0}
  @media(max-width:720px){
    .actionbar{bottom:calc(60px + var(--sab));margin:18px -16px 0;padding:11px 16px}
  }

  /* ---------------- formulaires ---------------- */
  .f{display:block;margin-bottom:15px}
  .f > span{display:block;font-size:12.5px;font-weight:640;color:var(--t2);margin-bottom:6px}
  .f input,.f select,.f textarea{
    width:100%;display:block;padding:12px 13px;border:1px solid var(--hair);border-radius:14px;
    background:var(--s3);min-height:var(--tap);transition:border-color .15s,box-shadow .15s
  }
  .f input:focus,.f select:focus,.f textarea:focus{
    border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-s)
  }
  .f input[type=date],.f input[type=time],.f input[type=number]{-webkit-appearance:none;appearance:none;text-align:left}
  .f input[type=number]{-moz-appearance:textfield}
  .f input::-webkit-date-and-time-value{text-align:left;min-height:21px}
  .f input::-webkit-calendar-picker-indicator{opacity:.55;padding-left:6px}
  .f textarea{min-height:150px;line-height:1.55;resize:vertical}
  .f select{appearance:none;-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--t2) 50%),linear-gradient(135deg,var(--t2) 50%,transparent 50%);
    background-position:calc(100% - 19px) 51%,calc(100% - 13px) 51%;
    background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:38px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 10px}
  .grid2 > *{min-width:0}
  .check{display:flex;align-items:center;gap:11px;min-height:var(--tap);font-size:14.5px}
  .check input{width:21px;height:21px;accent-color:var(--acc);flex:none;min-height:0}
  .inline{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
  .inline .f{flex:1 1 150px;margin-bottom:0;min-width:0}
  .inline .btn{flex:0 1 auto;white-space:nowrap}

  .seg{
    display:flex;background:var(--ink7);border:1px solid var(--hair);
    border-radius:14px;padding:3px;gap:3px
  }
  .seg button{
    flex:1 1 0;min-width:0;border:0;background:transparent;padding:11px 6px;border-radius:11px;
    font-weight:620;color:var(--t2);font-size:14.5px;min-height:44px;
    display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
    transition:background .16s,color .16s,box-shadow .16s
  }
  .seg button:hover{color:var(--t1)}
  /* état actif franc : remplissage plein, plus la pastille blanche sur gris pâle */
  .seg button[aria-pressed="true"]{
    background:var(--t1);color:var(--sheet);box-shadow:var(--sh-1)
  }
  .seg button[aria-pressed="true"] .ic{opacity:.9}
  /* le choix du lieu reprend les couleurs des pastilles domicile / extérieur */
  .seg.lieu button[data-v="domicile"][aria-pressed="true"]{background:var(--ok-d);color:#fff}
  .seg.lieu button[data-v="exterieur"][aria-pressed="true"]{background:var(--acc);color:var(--acc-on)}
  .seg.mini button[aria-pressed="true"]{background:var(--acc);color:var(--acc-on)}
  /* méthode de planification : vert pour l'ajout, rouge pour l'effacement */
  .seg.meth button[data-mode="fill"][aria-pressed="true"]{background:var(--ok-d);color:#fff}
  .seg.meth button[data-mode="all"][aria-pressed="true"]{background:var(--bad);color:#fff}
  @media(max-width:400px){.seg button{font-size:13.5px;gap:4px;padding:11px 4px}}
  .nbsel{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .seg.mini{width:auto;flex:none;padding:3px;border-radius:12px}
  .seg.mini button{flex:0 0 auto;min-width:38px;min-height:34px;padding:6px 10px;font-size:13.5px;font-variant-numeric:tabular-nums}

  .drop{
    border:1.5px dashed var(--hair);border-radius:var(--r);padding:28px 18px;
    text-align:center;background:var(--s2);transition:.16s;cursor:pointer
  }
  .drop:hover{background:var(--s3);border-color:var(--acc)}
  .drop.over{background:var(--acc-s);border-color:var(--acc);border-style:solid}
  .drop .dz-ic{color:var(--acc);margin-bottom:9px}
  .drop b{display:block;font-size:15px;font-weight:640;margin-bottom:3px}

  /* ---------------- listes ---------------- */
  .prow{
    width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--hair-2);
    padding:11px 16px;display:flex;gap:12px;align-items:center;min-height:62px;transition:background .14s
  }
  .prow:hover{background:var(--s2)}
  .prow .grow{flex:1;min-width:0}
  .name{font-weight:620;font-size:15px}
  .meta{font-size:12.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .avatar{
    width:38px;height:38px;border-radius:13px;background:var(--ink7);color:var(--t2);
    display:grid;place-items:center;font-size:13px;font-weight:700;flex:none
  }
  .avatar.c{background:var(--acc-s);color:var(--acc-d)}
  .chev{color:var(--t3);transition:transform .2s}
  .chev.open{transform:rotate(180deg)}
  .panel{padding:2px 16px 15px 66px;border-bottom:1px solid var(--hair-2);background:var(--s2)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:680;background:var(--ink7);color:var(--t2);vertical-align:1px}
  .pill.dom{background:rgba(47,169,106,.16);color:var(--ok-d)}
  .pill.ext{background:var(--acc-s);color:var(--acc-d)}
  .pill.off{background:rgba(229,72,77,.14);color:var(--bad)}
  .pill.coach{background:var(--acc-s);color:var(--acc-d)}
  .pill.next{background:var(--acc);color:var(--acc-on)}

  .ctl{display:flex;flex-direction:column;gap:5px;margin-top:2px}
  .ct{font-size:13.5px;color:var(--t2);display:flex;gap:8px;align-items:center}
  .ct b{color:var(--t3);font-weight:620;font-size:12px;min-width:74px;flex:none}
  .ct a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);gap:8px;margin-bottom:8px;align-items:start}
  .crow input{padding:12px 11px;border:1px solid var(--hair);border-radius:13px;background:var(--s3);width:100%;min-height:var(--tap)}
  .crow .lb{color:var(--t2);font-weight:600}
  .crow.del{grid-template-columns:minmax(0,34%) minmax(0,1fr) 44px}
  .crow.del button{padding:0;min-height:var(--tap);border-radius:13px}
  @media(max-width:440px){
    .crow{grid-template-columns:1fr;gap:6px;margin-bottom:12px}
    .crow .lb{min-height:40px;padding:9px 11px;background:var(--ink5);border-style:dashed}
    .crow.del{grid-template-columns:minmax(0,1fr) 44px}
    .crow.del .vl{grid-column:1/-1}
  }

  .salle{border:1px solid var(--hair);border-radius:16px;padding:13px;margin-bottom:10px;background:var(--s2);transition:.16s}
  .salle .s-top{display:flex;gap:8px;margin-bottom:8px}
  .salle .s-nom{flex:1;min-width:0;font-weight:640}
  .salle input{padding:11px 12px;border:1px solid var(--hair);border-radius:12px;background:var(--s3);width:100%;min-height:44px}
  .salle .s-del{flex:none;width:46px;padding:0;min-height:44px;border-radius:12px;color:var(--bad)}
  .salle .s-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
  .salle .s-def{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:620;color:var(--t2);min-height:32px;cursor:pointer}
  .salle .s-def input{width:20px;height:20px;min-height:0;accent-color:var(--acc);flex:none;padding:0}
  .salle:has(.s-def input:checked){border-color:var(--acc);background:var(--acc-s)}
  .salle:has(.s-def input:checked) .s-def{color:var(--acc-d)}

  /* ---------------- matchs ---------------- */
  .match{
    display:flex;width:100%;text-align:left;background:transparent;padding:0;
    border:0;border-bottom:1px solid var(--hair-2);position:relative;transition:background .14s
  }
  .match:hover{background:var(--s2)}
  .match.is-next::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
  .mdate{flex:none;width:66px;padding:15px 0;text-align:center}
  .mdate b{display:block;font-size:23px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.035em}
  .mdate span{display:block;font-size:11.5px;color:var(--t3);margin-top:4px;text-transform:capitalize}
  .mbody{flex:1;padding:13px 16px 13px 4px;min-width:0}
  .mbody .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .mbody .l1 .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbody .l2{font-size:12.5px;color:var(--t3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .duty{display:inline-flex;gap:6px;margin-top:8px;align-items:center}
  .duty i{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:var(--ink5);color:var(--t3)}
  .duty i.ok{background:rgba(47,169,106,.16);color:var(--ok-d)}

  .clock{display:flex;border-radius:var(--r);overflow:hidden;background:var(--s2);border:1px solid var(--hair)}
  .clock > div{flex:1;padding:15px 8px;text-align:center;border-right:1px solid var(--hair-2);min-width:0}
  .clock > div:last-child{border-right:0}

/* Stockage : API des artefacts Claude si présente, sinon localStorage du navigateur,
   sinon mémoire volatile. Permet au même fichier de tourner dans les deux contextes. */
const LS=(()=>{try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch(e){return false}})();
async function save(){
  const t=JSON.stringify(S);
  try{ if(window.storage&&window.storage.set){await window.storage.set(KEY,t);return} }catch(e){}
  try{ if(LS){localStorage.setItem(KEY,t);return} }catch(e){}
  mem[KEY]=t;
}
async function load(){
  try{ if(window.storage&&window.storage.get){const r=await window.storage.get(KEY);if(r&&r.value)return JSON.parse(r.value)} }catch(e){}
  try{ if(LS){const v=localStorage.getItem(KEY);if(v)return JSON.parse(v)} }catch(e){}
  if(mem[KEY]){try{return JSON.parse(mem[KEY])}catch(e){}}
  return null;
}

function normHeure(h){
  if(!h)return '';
  const m=/^(\d{1,2})\s*[h:.]\s*(\d{0,2})$/.exec(String(h).trim());
  if(!m)return String(h);
  return String(+m[1]).padStart(2,'0')+':'+(m[2]||'00').padEnd(2,'0');
}
function toMin(t){if(!t)return null;const m=/^(\d{1,2})[h:.](\d{2})$/.exec(String(t).trim());return m?+m[1]*60+ +m[2]:null}
function toHM(v){if(v==null)return '—';v=((v%1440)+1440)%1440;return String(Math.floor(v/60)).padStart(2,'0')+'h'+String(v%60).padStart(2,'0')}
function frDate(d){const dt=new Date(d+'T12:00:00');return isNaN(dt)?(d||''):dt.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function dayNum(d){const dt=new Date(d+'T12:00:00');return isNaN(dt)?'?':dt.getDate()}
function dayName(d){const dt=new Date(d+'T12:00:00');return isNaN(dt)?'':dt.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','')}
function rel(d){
  const t=new Date();t.setHours(12,0,0,0);
  const dt=new Date(d+'T12:00:00'); if(isNaN(dt))return '';
  const j=Math.round((dt-t)/86400000);
  if(j===0)return "aujourd'hui"; if(j===1)return 'demain';
  if(j>1&&j<8)return dt.toLocaleDateString('fr-FR',{weekday:'long'});
  if(j>=8&&j<31)return 'dans '+j+' jours';
  return '';
}
const sortedMatches=()=>[...S.matches].sort((a,b)=>((a.date||'')+(a.heure||'')).localeCompare((b.date||'')+(b.heure||'')));

function times(m){

}

/* ============ migration ============ */
function migrate(){
  S.staff=S.staff||[]; S.settings=S.settings||{}; S.players=S.players||[]; S.matches=S.matches||[];
  if(!Array.isArray(S.settings.salles))S.settings.salles=[];
  S.settings.salles=S.settings.salles.map(s=>typeof s==='string'?{nom:s,adresse:''}:s).filter(s=>s&&s.nom);
  S.settings.salles.forEach(s=>{if(!s.id)s.id=uid()});
  /* la salle par défaut suit la liste : vide tant qu'aucune salle n'est saisie */
  if(!S.settings.salles.some(s=>s.nom===S.settings.salleDef))
    S.settings.salleDef=S.settings.salles.length?S.settings.salles[0].nom:'';
  /* Le parcours de démarrage ne s'affiche que pour une installation neuve :
     une sauvegarde restaurée ou des données déjà saisies l'ont dépassé. */
  if(S.settings.onboarding===undefined)
    S.settings.onboarding=(S.players.length||S.matches.length||S.settings.salles.length)?0:1;
  delete S.settings.salle; delete S.settings.trajetDef;
  delete S.settings.defMontbert; delete S.settings.coachsAjoutes;
  if(S.settings.exemptStaff===undefined)S.settings.exemptStaff=true;
  if(!S.settings.avant)S.settings.avant=45;
  S.players.forEach(p=>{p.mails=normContacts(p.mails,'mail');p.tels=normContacts(p.tels,'tel')});
  S.staff.forEach(s=>{
    s.mails=normContacts(s.mails&&s.mails.length?s.mails:(s.mail?[s.mail]:[]),'mail');
    s.tels=normContacts(s.tels&&s.tels.length?s.tels:(s.tel?[s.tel]:[]),'tel');
    delete s.mail;delete s.tel;delete s.role;
  });
  S.matches.forEach(m=>{
    if(!Array.isArray(m.staff))m.staff=S.staff.map(s=>s.id);
    if(!Array.isArray(m.absents))m.absents=[];
    if(!m.depart)m.depart=(m.lieu==='domicile'?(m.salle||S.settings.salleDef):S.settings.salleDef);
    m.heure=normHeure(m.heure);
  });
  if(!S.settings.tplDom)S.settings.tplDom=TPL_DOM;
  if(!S.settings.tplExt)S.settings.tplExt=TPL_EXT;
  ['tplDom','tplExt'].forEach(k=>{
    S.settings[k]=S.settings[k]
      .replace(/👤 Encadrement : \{encadrement\}/g,'👤 Coachs : {coachs}')
      .replace(/\{encadrement\}/g,'{coachs}');
    if(!S.settings[k].includes('{coachs}'))
      S.settings[k]=S.settings[k].includes('{joueurs}')
        ? S.settings[k].replace('{joueurs}','{joueurs}\n\n👤 Coachs : {coachs}')
        : S.settings[k]+'\n👤 Coachs : {coachs}';
  });
}

/* ============ estimation des trajets ============ */
const normTxt=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
function findCommune(txt){
  const t=' '+normTxt(txt)+' ';
  let best=null;
  COMMUNES.forEach(c=>{
    if(t.includes(' '+c[0]+' ')&&(!best||c[0].length>best[0].length))best=c;
  });
  return best;
}
function haversine(a,b){
  const R=6371,r=Math.PI/180;
  const dl=(b[1]-a[1])*r, dp=(b[2]-a[2])*r;
  const x=Math.sin(dl/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dp/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
/* renvoie {min, why} ou null */
/* lien Google Maps : itinéraire pour un déplacement, simple repère à domicile */
function mapsUrl(m){
  const E=encodeURIComponent;
  const dest=String(m.adresse||m.salle||'').trim();
  if(!dest)return null;
  if(m.lieu==='domicile')
    return 'https://www.google.com/maps/search/?api=1&query='+E(dest);
  const sa=salles().find(x=>x.nom===m.depart);
  const orig=String((sa&&sa.adresse)||m.depart||'').trim();
  if(!orig)return 'https://www.google.com/maps/search/?api=1&query='+E(dest);
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+E(orig)+'&destination='+E(dest);
}

/* destTxt = l'adresse du match : c'est elle qui porte la commune d'arrivée */
function estimTrajet(depart,destTxt,skipId){
  const dk=normTxt(depart);
  if(!normTxt(destTxt))return null;
  const b=findCommune(destTxt);
  if(!b)return null;
  /* 1. un match précédent dans la même commune, depuis la même salle */
  const prev=S.matches.find(m=>{
    if(m.id===skipId||m.lieu!=='exterieur'||!(+m.trajet>0))return false;
    if(normTxt(m.depart)!==dk)return false;
    const pc=findCommune(m.adresse||'');
    return pc&&pc[0]===b[0];
  });
  if(prev)return {min:+prev.trajet,why:'durée déjà utilisée pour '+(prev.adversaire||'un match précédent')};
  /* 2. distance à vol d'oiseau entre communes connues */
  const a=findCommune(depart);
  if(!a)return null;
  const km=haversine(a,b)*1.28;
  if(km<1)return {min:10,why:'même commune'};
  const v=48+Math.min(24,km/2.2);
  const min=Math.max(10,Math.round(km/v*60/5)*5);
  return {min,why:'≈ '+Math.round(km)+' km, '+cap(a[0])+' → '+cap(b[0])};
}
const cap=s=>String(s).toLowerCase().replace(/(^|[\s-])\w/g,c=>c.toUpperCase());


/* ============ équité ============ */
function counts(exclude){
  const c={};
  S.players.forEach(p=>c[p.id]={transport:0,bar:0,lavage:0,total:0,convocs:0,abs:0});
  S.matches.forEach(m=>{
    if(exclude&&m.id===exclude)return;
    (m.convoques||[]).forEach(id=>{if(c[id])c[id].convocs++});
    (m.absents||[]).forEach(id=>{if(c[id])c[id].abs++});
    ['transport','bar','lavage'].forEach(t=>{
      (m[t]||[]).forEach(id=>{if(c[id]){c[id][t]++;c[id].total++}});
    });
  });
  return c;
}
function cycle(m){
  const c=counts(m?m.id:null), act=eligible();
  if(!act.length)return {tour:0,left:[],done:[],total:0};
  const min=Math.min(...act.map(p=>c[p.id].lavage));
  return {tour:min+1,total:act.length,
    left:act.filter(p=>c[p.id].lavage===min).map(p=>p.id),
    done:act.filter(p=>c[p.id].lavage>min).map(p=>p.id)};
}
function suggest(m,type,n){
  const c=counts(m.id), abs=new Set(m.absents||[]);
  const ok=new Set(eligible().map(p=>p.id).filter(id=>!abs.has(id)));
  const cv=(m.convoques||[]).filter(id=>ok.has(id));
  const conv=cv.length?cv:null, all=[...ok];
  let pool;
  if(type==='lavage'){
    const cy=cycle(m), left=cy.left.filter(id=>!abs.has(id));
    pool=conv?left.filter(id=>conv.includes(id)):left.slice();
    if(!pool.length)pool=left.slice();
    if(!pool.length)pool=conv||all;
  }else pool=conv||all;
  const busy=new Set([].concat(...['transport','bar','lavage'].filter(k=>k!==type).map(k=>m[k]||[])));
  pool.sort((a,b)=>{
    const A=c[a]||{},B=c[b]||{};
    return (busy.has(a)-busy.has(b))||((A[type]||0)-(B[type]||0))||((A.total||0)-(B.total||0))
      ||full(a).localeCompare(full(b),'fr');
  });
  return pool.slice(0,n);
}
/* ---- planification de plusieurs matchs d'un coup ---- */
/* Le calcul tourne sur une copie de l'état : les compteurs d'équité s'accumulent
   d'un match au suivant, exactement comme si on les attribuait un par un. */
function planCompute(ids,tasks,mode,convoquer){
  const backup=S, clone=JSON.parse(JSON.stringify(S));
  const ordre=ids.slice().sort((a,b)=>{
    const A=S.matches.find(x=>x.id===a)||{}, B=S.matches.find(x=>x.id===b)||{};
    return ((A.date||'')+(A.heure||'')).localeCompare((B.date||'')+(B.heure||''));
  });
  S=clone;
  try{
    ordre.forEach(id=>{
      const m=clone.matches.find(x=>x.id===id);
      if(!m||estPasse(m))return;   /* un match passé n'est jamais recalculé */
      if(convoquer&&!(m.convoques||[]).length)
        m.convoques=clone.players.filter(p=>p.actif&&!(m.absents||[]).includes(p.id)).map(p=>p.id);
      const dom=m.lieu==='domicile', jobs=[];
      if(dom&&tasks.bar)jobs.push(['bar',2]);
      if(!dom&&tasks.transport)jobs.push(['transport',nbTransport(m)]);
      if(tasks.lavage)jobs.push(['lavage',1]);
      jobs.forEach(([k,n])=>{
        if(mode==='all')m[k]=[];
        m[k]=m[k]||[];
        if(m[k].length>=n)return;
        const manque=n-m[k].length;
        const add=suggest(m,k,n).filter(x=>!m[k].includes(x)).slice(0,manque);
        m[k]=m[k].concat(add);
      });
    });
  } finally { S=backup; }
  return {clone,ordre};
}

/* m.msg, s'il existe, remplace le texte généré */
const msgOf=m=>(m&&typeof m.msg==='string')?m.msg:buildMsg(m);
function buildMsg(m){
  const t=times(m), st=S.settings;
  const list=(m.convoques||[]).map(id=>'· '+pre(id)).join('\n')||'—';
  const nm=a=>(a&&a.length)?a.map(id=>pre(id)).join(' · '):'à définir';
  return (m.lieu==='domicile'?st.tplDom:st.tplExt)
    .replace(/{equipe}/g,st.equipe||'')
    .replace(/{date}/g,frDate(m.date))
    .replace(/{adversaire}/g,m.adversaire||'')
    .replace(/{salle}/g,m.salle||(m.lieu==='domicile'?st.salleDef:''))
    .replace(/{adresse}/g,m.adresse||'')
    .replace(/{heure}/g,toHM(toMin(m.heure)))
    .replace(/{rdv}/g,toHM(t.rdv))
    .replace(/{arrivee}/g,toHM(t.arrivee))
    .replace(/{depart}/g,m.depart||st.salleDef||'')
    .replace(/{trajet}/g,m.trajet||0)
    .replace(/{avant}/g,st.avant)
    .replace(/{nb}/g,(m.convoques||[]).length)
    .replace(/{joueurs}/g,list)
    .replace(/{absents}/g,(m.absents||[]).length?(m.absents||[]).map(id=>pre(id)).join(' · '):'aucun')
    .replace(/{nbabs}/g,(m.absents||[]).length)
    .replace(/{transport}/g,nm(m.transport))
    .replace(/{bar}/g,nm(m.bar))
    .replace(/{lavage}/g,nm(m.lavage))
    .replace(/{coachs}|{encadrement}/g,(m.staff||[]).length
      ? (m.staff||[]).map(id=>ST(id)?coachName(id):'').filter(Boolean).join(' · ') : 'à définir')
    .replace(/\n{3,}/g,'\n\n');
}

/* Applique au modèle les lignes de salles saisies dans #s_salles : renommages et
   suppressions sont répercutés sur les matchs concernés. Renvoie le nombre de
   matchs déplacés, ou -1 si la saisie est refusée ou la confirmation annulée. */
function applySalles(minUne){
  const box=document.querySelector('#s_salles');
  if(!box)return 0;
  const rows=[...box.querySelectorAll('.salle')].map(r=>({
    id:r.dataset.id, ancien:r.dataset.nom||'',
    nom:r.querySelector('.s-nom').value.trim(),
    adresse:r.querySelector('.s-adr').value.trim(),
    def:r.querySelector('.s-def input').checked
  })).filter(x=>x.nom);
  if(minUne&&!rows.length){toast('Gardez au moins une salle : des matchs se jouent à domicile');return -1}
  const vus=new Set();
  for(const r of rows){
    const k=r.nom.toLowerCase();
    if(vus.has(k)){toast('Deux salles portent le même nom');return -1}
    vus.add(k);
  }
  const defNom=rows.length?(rows.find(r=>r.def)||rows[0]).nom:'';
  /* salles retirées : on prévient si des matchs les utilisent */
  const gardees=new Set(rows.map(r=>r.id));
  const retirees=salles().filter(x=>!gardees.has(x.id));
  const touches=new Set();
  retirees.forEach(x=>S.matches.forEach(m=>{if(m.salle===x.nom||m.depart===x.nom)touches.add(m.id)}));
  if(touches.size&&!confirm(touches.size+' match'+(touches.size>1?'s utilisent':' utilise')+
     ' une salle que vous supprimez.\n\n'+(defNom?'Les basculer sur '+defNom+' ?':'Les laisser sans salle ?')))return -1;
  /* renommages, repérés par identifiant */
  rows.forEach(r=>{
    if(r.ancien&&r.ancien!==r.nom)S.matches.forEach(m=>{
      if(m.salle===r.ancien)m.salle=r.nom;
      if(m.depart===r.ancien)m.depart=r.nom;
    });
  });
  retirees.forEach(x=>S.matches.forEach(m=>{
    if(m.salle===x.nom)m.salle=defNom;
    if(m.depart===x.nom)m.depart=defNom;
  }));
  S.settings.salles=rows.map(r=>({id:r.id,nom:r.nom,adresse:r.adresse}));
  S.settings.salleDef=defNom;
  /* l'adresse d'une salle suit sur les matchs à domicile qui s'y jouent */
  rows.forEach(r=>S.matches.forEach(m=>{if(m.lieu==='domicile'&&m.salle===r.nom)m.adresse=r.adresse}));
  return touches.size;
}
function sheet(title,html,onOpen,opts){
  const ov=document.createElement('div');
  ov.className='ov';
  ov.innerHTML=`<div class="sheet"><div class="grab"></div>
    <div class="sheet-h"><h2>${esc(title)}</h2>
    <button class="btn sm ghost" data-x>${I('x',16)} Fermer</button></div>${html}</div>`;
  ov.addEventListener('click',e=>{
    if(e.target===ov||e.target.hasAttribute('data-x')||e.target.closest('[data-x]'))ov.remove();
  });
  ($||document.body).appendChild(ov);
  /* garde le champ actif visible quand le clavier s'ouvre */
  ov.addEventListener('focusin',e=>{
    if(!e.target.matches('input,select,textarea'))return;
    setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}} ,260);
  });
  if(onOpen)onOpen(ov);

     le focus, Ctrl+Entrée valide. Échap est géré globalement plus bas. */

    if(f)try{f.focus()}catch(e){}

    const b=ov.querySelector('.sheet .btn.wide')||ov.querySelector('.sheet .btn:not(.ghost)');

/* ============ fichiers ============ */
let xp=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(xp)return xp;
  xp=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('x'));
    s.onerror=()=>rej(new Error('cdn'));
    document.head.appendChild(s);
  });
  return xp;
}
function splitLines(txt){
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return [];
  const sep=lines[0].includes('\t')?'\t':(lines[0].includes(';')?';':(lines[0].includes(',')?',':'\t'));
  return lines.map(l=>l.split(sep).map(x=>x.trim().replace(/^"|"$/g,'')));
}
function fmtCell(v){
  if(v==null)return '';
  if(v instanceof Date){
    const p=n=>String(n).padStart(2,'0');
    if(v.getHours()||v.getMinutes())return p(v.getHours())+':'+p(v.getMinutes());
    return p(v.getDate())+'/'+p(v.getMonth()+1)+'/'+v.getFullYear();
  }
  return String(v).trim();
}
/* lit un fichier et renvoie un tableau de lignes (tableaux de chaînes) */
function readFile(file,prefer){
  const n=(file.name||'').toLowerCase();
  if(/\.(xlsx|xlsm|xls)$/.test(n)){
    return loadXLSX().then(X=>new Promise((res,rej)=>{
      const fr=new FileReader();
      fr.onload=()=>{
        try{
          const wb=X.read(new Uint8Array(fr.result),{type:'array',cellDates:true});
          const nm=wb.SheetNames.find(s=>s.toLowerCase().startsWith(prefer))||wb.SheetNames[0];
          const aoa=X.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:false,dateNF:'dd/mm/yyyy'});
          res(aoa.map(r=>(r||[]).map(fmtCell)).filter(r=>r.some(x=>x!=='')));
        }catch(e){rej(e)}
      };
      fr.onerror=()=>rej(new Error('lecture'));
      fr.readAsArrayBuffer(file);
    }));
  }
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(splitLines(String(fr.result)));
    fr.onerror=()=>rej(new Error('lecture'));
    fr.readAsText(file,'utf-8');
  });
}
function dropZone(id,prefer,onRows){
  const dz=document.getElementById(id);
  if(!dz)return;
  const inp=dz.querySelector('input[type=file]');
  const handle=f=>{
    if(!f)return;
    dz.querySelector('.dzt').textContent='Lecture de '+f.name+'…';
    readFile(f,prefer).then(rows=>{
      dz.querySelector('.dzt').textContent=f.name+' — '+rows.length+' ligne(s) lues';
      onRows(rows);
    }).catch(e=>{
      dz.querySelector('.dzt').textContent='Lecture impossible';
      toast(e.message==='cdn'?'Fichier Excel illisible hors ligne, collez les lignes':'Fichier illisible');
    });
  };
  dz.onclick=e=>{if(e.target!==inp)inp.click()};
  inp.onchange=()=>handle(inp.files[0]);
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));
  dz.addEventListener('drop',e=>handle(e.dataTransfer.files[0]));
}

/* ---- export agenda (.ics) ---- */
function icsStamp(dateStr,minutes){
  if(!dateStr||minutes==null)return null;
  const d=new Date(dateStr+'T00:00:00');
  if(isNaN(d))return null;
  d.setMinutes(((minutes%1440)+1440)%1440);
  if(minutes<0)d.setDate(d.getDate()-1);
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00';
}
function icsEsc(t){return String(t||'').replace(/\\/g,'\\\\').replace(/[,;]/g,c=>'\\'+c).replace(/\r?\n/g,'\\n')}
function buildIcs(list){
  const now=new Date(), p=n=>String(n).padStart(2,'0');
  const stamp=now.getUTCFullYear()+p(now.getUTCMonth()+1)+p(now.getUTCDate())+'T'
    +p(now.getUTCHours())+p(now.getUTCMinutes())+p(now.getUTCSeconds())+'Z';
  const ev=[];
  list.forEach(m=>{
    const t=times(m), h=toMin(m.heure);
    const deb=icsStamp(m.date,t.rdv!=null?t.rdv:h);
    const fin=icsStamp(m.date,(h!=null?h:0)+100);
    if(!deb||!fin)return;
    const lieu=[m.salle,m.adresse].filter(Boolean).join(', ');
    ev.push(['BEGIN:VEVENT','UID:'+m.id+'@equipe-basket','DTSTAMP:'+stamp,
      'DTSTART:'+deb,'DTEND:'+fin,
      'SUMMARY:'+icsEsc((S.settings.equipe||'Match')+' vs '+(m.adversaire||'?')+(m.lieu==='domicile'?' (domicile)':' (extérieur)')),
      'LOCATION:'+icsEsc(lieu),
      'DESCRIPTION:'+icsEsc(msgOf(m)),
      'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Départ bientôt — '+(m.adversaire||'')),
      'END:VALARM','END:VEVENT'].join('\r\n'));
  });
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gestion equipe basket//FR','CALSCALE:GREGORIAN',
    'X-WR-CALNAME:'+icsEsc(S.settings.equipe||'Mon équipe')].concat(ev,['END:VCALENDAR']).join('\r\n');
}
function download(nom,contenu,type){

        <i class="${d1?'ok':''}">${I(dom?'cup':'car',14)}</i>
        <i class="${(m.lavage||[]).length?'ok':''}">${I('shirt',14)}</i>
        ${next?'<span class="pill next" style="margin-left:5px">prochain</span>':''}
      </div>
    </div>
  </button>`;
}
function heroCard(m){
  const t=times(m), dom=m.lieu==='domicile', r=rel(m.date);
  const d=new Date(m.date+'T12:00:00');
  const quand=(isNaN(d)?'':d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}));
  const manque=[];
  if(!(m.convoques||[]).length)manque.push('convocations');
  if(dom?(m.bar||[]).length<2:(m.transport||[]).length<nbTransport(m))manque.push(dom?'bar':'transport');
  if(!(m.lavage||[]).length)manque.push('maillots');
  return `<div class="hero">
    <div class="lbl">${r?esc(r):'prochain match'}</div>
    <h2>${esc(m.adversaire||'Adversaire ?')} <span class="pill ${dom?'dom':'ext'}">${dom?'domicile':'extérieur'}</span></h2>
    <div class="when">${esc(quand)} · ${esc(dom?(m.salle||''):(m.salle||m.adresse||''))}</div>
    <div class="htimes">
      <div class="hi"><span>${dom?'Rendez-vous':'Départ'}</span><b>${toHM(t.rdv)}</b></div>
      ${dom?'':`<div><span>Arrivée</span><b>${toHM(t.arrivee)}</b></div>`}
      <div><span>Match</span><b>${toHM(toMin(m.heure))}</b></div>
    </div>
    ${manque.length?`<div class="tiny" style="margin-top:12px">${I('ban',14)} Reste à faire : ${manque.join(', ')}.</div>`:
      `<div class="tiny" style="margin-top:12px">${I('check',14)} Tout est attribué.</div>`}
    <div class="hact">
      <button class="btn" onclick="BB.open('${m.id}')">${I('cal',17)} Ouvrir</button>
      <button class="btn ghost" onclick="BB.openThen('${m.id}','copyMsg')">${I('copy',17)} Copier</button>
    </div>
  </div>`;
}
function matchList(){
  const ms=sortedMatches(), today=new Date().toISOString().slice(0,10);
  const next=ms.filter(m=>(m.date||'')>=today), past=ms.filter(m=>(m.date||'')<today).reverse();
  return `
  ${next.length?heroCard(next[0]):''}
  <div class="row" style="margin-bottom:12px">
    <button class="btn" style="flex:1" onclick="BB.editMatch()">${I('plus')} Ajouter un match</button>
    <button class="btn ghost" onclick="BB.importMatches()">${I('up')} Importer</button>
  </div>
  ${next.length>1?`<button class="btn ghost wide" style="margin-bottom:12px" onclick="BB.plan()">${I('wand')} Planifier plusieurs matchs</button>`:''}
  <div class="card">
    <div class="card-h"><h3>À venir</h3><span class="tiny">${next.length}</span></div>
    ${next.map((m,i)=>matchRow(m,i===0)).join('')||
      `<div class="empty">${I('cal',30)}<b>Aucun match à venir</b>Ajoutez un match ou importez le calendrier de la saison.</div>`}
  </div>
  ${past.length?`<details class="card past">
    <summary>${I('clock')} Matchs passés <span class="tiny">${past.length}</span> <span class="chev">${I('chev')}</span></summary>
    ${past.map(m=>matchRow(m,false)).join('')}
  </details>`:''}`;
}

function matchDetail(){
  const m=S.matches.find(x=>x.id===view.match);
  if(!m){view.match=null;return matchList()}
  const t=times(m), dom=m.lieu==='domicile', c=counts(m.id), cy=cycle(m);
  const nbT=nbTransport(m), passe=estPasse(m);
  const pool=S.players.filter(p=>p.actif);
  const conv=pool.map(p=>{
    const isC=(m.convoques||[]).includes(p.id), isA=(m.absents||[]).includes(p.id);
    const et=isC?'c':(isA?'a':''), n=(c[p.id]||{}).convocs||0;
    return `<button class="jchip" data-et="${et}" onclick="BB.cycleConv('${p.id}')"
      title="${esc(full(p.id))} — ${n} convocation${n>1?'s':''}${isA?' · noté absent':''}">
      <span class="jav">${isC?I('check',15):(isA?I('ban',15):esc(initials(p)))}</span>
      <span class="jnm">${esc(pre(p.id))}</span>
      <span class="jn">${n}</span>
    </button>`;
  }).join('');

  const taskBlock=(key,label,icon,n,help,nbCtl)=>{
    const cur=m[key]||[], lav=key==='lavage';
    const cand=(m.convoques&&m.convoques.length)?m.convoques:pool.map(p=>p.id);
    const chips=cand.map(id=>{
      const ex=S.settings.exemptStaff&&isStaffFam(id);
      const done=lav&&!ex&&cy.done.includes(id);
      const tt=ex?'Famille d\u2019un coach, exemptée':(done?'A déjà lavé pendant ce tour':'');
      return `<button class="chip${done||ex?' done':''}" data-on="${cur.includes(id)?1:0}"
        onclick="BB.toggleTask('${key}','${id}',${n})" ${tt?'title="'+tt+'"':''}>${esc(pre(id))}<span class="n">${done?'✓':''}${(c[id]||{})[key]||0}</span></button>`;
    }).join('');
    let note='';
    if(lav){
      const rest=cy.left.filter(id=>!cur.includes(id)).length;
      const hs=cur.filter(id=>cy.done.includes(id));
      note=`<div class="tiny" style="margin-bottom:8px">Tour ${cy.tour} · ${cy.total-cy.left.length}/${cy.total} familles passées, ${rest} restante${rest>1?'s':''}.</div>`
        +(hs.length?`<div class="warn" style="margin-top:0;margin-bottom:9px">${hs.map(id=>esc(pre(id))).join(', ')} a déjà lavé pendant ce tour.</div>`:'');
    }
    return `<div class="task">
      <div class="th"><b>${I(icon)} ${label} <span class="tiny">${cur.length}/${n}</span></b>
        ${passe?'':`<button class="btn sm ghost" onclick="BB.auto('${key}',${n})">${I('wand',16)} Proposer</button>`}</div>
      <div class="tiny" style="margin-bottom:9px">${help}</div>
      ${nbCtl?`<div class="nbsel">
        <span class="tiny">Nombre de voitures</span>
        <div class="seg mini">${[1,2,3,4].map(k=>`<button type="button" aria-pressed="${k===n}" onclick="BB.setNb('${key}',${k})">${k}</button>`).join('')}</div>
      </div>`:''}${note}
      <div class="chips">${chips}</div>
    </div>`;
  };

  return `
  <div class="cols">
  <div class="colspan">
  <button class="link" onclick="BB.go('matchs')">${I('back',18)} Calendrier</button>
  <div class="card" style="margin-top:4px">
    <div class="card-h">
      <div style="min-width:0">
        <h3>${esc(m.adversaire||'Adversaire ?')}</h3>
        <div class="tiny" style="text-transform:capitalize">${esc(frDate(m.date))}${rel(m.date)?' · '+esc(rel(m.date)):''}</div>
      </div>
      <span class="pill ${dom?'dom':'ext'}">${dom?'Domicile':'Extérieur'}</span>
    </div>
    <div class="card-b">
      <div class="clock">
        ${dom?`
          <div class="hi"><span>Rendez-vous</span><b>${toHM(t.rdv)}</b><i>${esc(m.salle||'')}</i></div>
          <div><span>Coup d'envoi</span><b>${toHM(toMin(m.heure))}</b><i>${S.settings.avant} min après</i></div>`
        :`
          <div class="hi"><span>Départ</span><b>${toHM(t.rdv)}</b><i>${esc(m.depart||S.settings.salleDef)}</i></div>
          <div><span>Arrivée</span><b>${toHM(t.arrivee)}</b><i>${m.trajet||0} min de route</i></div>
          <div><span>Match</span><b>${toHM(toMin(m.heure))}</b><i>${esc(m.salle||'')}</i></div>`}
      </div>
      ${m.adresse?`<div class="tiny" style="margin-top:11px;display:flex;gap:6px;align-items:flex-start">${I('pin',15)} <span>${esc(m.adresse)}</span></div>`:''}
      <div class="row" style="margin-top:13px">
        ${mapsUrl(m)?`<button class="btn sm ghost" onclick="BB.maps('${m.id}')">${I('map',16)} ${dom?'Voir la salle':'Itinéraire'}</button>`:''}
        <button class="btn sm ghost" onclick="BB.editMatch('${m.id}')">${I('edit',16)} Modifier</button>
        <button class="btn sm danger" onclick="BB.delMatch('${m.id}')">${I('trash',16)} Supprimer</button>
      </div>
    </div>
  </div>

  </div>
  <div class="col">
  <div class="sec-title">${I('users',17)} Convocations</div>
  <div class="card"><div class="card-b">
    <div class="jhead">
      <b>${(m.convoques||[]).length} convoqué${(m.convoques||[]).length>1?'s':''} sur ${pool.length}${(m.absents||[]).length?' · '+(m.absents||[]).length+' absent'+((m.absents||[]).length>1?'s':''):''}</b>
      <span class="row" style="gap:14px">
        <button class="link subtle" onclick="BB.allConv(1)">Tous</button>
        <button class="link subtle" onclick="BB.allConv(0)">Aucun</button>
      </span>
    </div>
    <div class="jgrid">${conv}</div>
    ${(m.absents||[]).length?`<div class="absline">${I('ban',15)} Absents : ${(m.absents||[]).map(id=>esc(pre(id))).join(', ')}</div>`:''}
    <div class="tiny" style="margin-top:11px">${TAP} pour faire défiler : non retenu → convoqué → absent. Le chiffre indique le nombre de convocations depuis le début de la saison. Un joueur noté absent n'est plus proposé pour les tours.</div>
  </div></div>

  <div class="sec-title">${I('board',17)} Coachs présents — ${(m.staff||[]).length}</div>
  <div class="card"><div class="card-b">
    ${S.staff.length?`<div class="chips">${S.staff.map(s=>`<button class="chip" data-on="${(m.staff||[]).includes(s.id)?1:0}"
        onclick="BB.toggleStaff('${s.id}')">${esc(coachName(s.id))}</button>`).join('')}</div>`
      :`<p class="muted">Aucun coach enregistré. <button class="link" onclick="BB.go('joueurs')">En ajouter un</button></p>`}
  </div></div>

  </div>
  <div class="col">
  <div class="sec-title">${I('scale',17)} Roulements</div>
  ${passe?`<div class="warn" style="margin:0 0 12px;display:flex;gap:10px;align-items:flex-start">${I('clock',17)}
    <span>Match passé. L'attribution automatique est désactivée pour ne pas réécrire l'historique sur lequel repose l'équité. Vous pouvez toujours corriger à la main.</span></div>`
   :`<button class="btn ghost wide" style="margin-bottom:11px" onclick="BB.autoAll()">${I('wand',17)} Tout proposer selon l'équité</button>`}
  ${dom?taskBlock('bar','Bar','cup',2,'2 familles par match à domicile.')
       :taskBlock('transport','Transport','car',nbT,
          nbT+' famille'+(nbT>1?'s':'')+' conductrice'+(nbT>1?'s':'')+' pour ce déplacement.'
          +((m.convoques||[]).length?' '+(m.convoques||[]).length+' joueurs convoqués'+((m.staff||[]).length?' et '+(m.staff||[]).length+' coach'+((m.staff||[]).length>1?'s':''):'')+' à transporter.':''),
          true)}
  ${taskBlock('lavage','Lavage des maillots','shirt',1,'1 famille par match, à tour de rôle : chacune passe une fois avant qu\u2019une famille repasse.')}

  </div>
  <div class="colspan">
  <div class="sec-title">${I('mail',17)} Convocation
    ${m.msg!=null?'<span class="pill">texte modifié</span>':''}
    <button class="link subtle" style="margin-left:auto;text-transform:none;letter-spacing:0" onclick="BB.editMsg()">${I('edit',15)} Modifier</button>
  </div>
  <div class="msg" onclick="BB.editMsg()" title="${COARSE?'Toucher':'Cliquer'} pour modifier">${esc(msgOf(m))}</div>
  ${m.msg!=null?`<div class="warn" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span style="flex:1;min-width:160px">Ce texte a été écrit à la main : il ne suit plus les changements de convocation ou de tours.</span>
    <button class="btn sm ghost" onclick="BB.resetMsg()">${I('undo',15)} Régénérer</button>
  </div>`:''}
  <div class="actionbar">
    <button class="btn wide" onclick="BB.copyMsg()">${I('copy')} Copier la convocation</button>
  </div>
  </div></div>`;
}

/* ---- effectif ---- */
function contactLines(p){
  const out=[];
  contacts(p.tels).forEach(t=>out.push(`<div class="ct"><b>${esc(t.label||'Tél')}</b><a href="tel:${esc(String(t.value).replace(/\s/g,''))}">${esc(t.value)}</a></div>`));
  contacts(p.mails).forEach(t=>out.push(`<div class="ct"><b>${esc(t.label||'Mail')}</b><a href="mailto:${esc(t.value)}">${esc(t.value)}</a></div>`));
  return out.length?`<div class="ctl">${out.join('')}</div>`:'<div class="tiny">Aucun contact enregistré</div>';
}

/* ---- récapitulatif : qui fait quoi, match par match ---- */
function recapView(){
  const ms=sortedMatches(), today=new Date().toISOString().slice(0,10);
  if(!ms.length)return `<div class="card"><div class="empty">${I('board',30)}<b>Aucun match</b>Le tableau se remplira dès que vous aurez ajouté des matchs.</div></div>`;
  const nm=(a,att)=>{
    if(a===null)return '<span class="na">—</span>';
    if(!a||!a.length)return '<span class="miss">à définir</span>';
    return a.map(id=>esc(pre(id))).join(', ')+(att&&a.length<att?' <span class="miss">+'+(att-a.length)+'</span>':'');
  };
  const rows=ms.map(m=>{
    const t=times(m), dom=m.lieu==='domicile', past=(m.date||'')<today;
    const d=new Date(m.date+'T12:00:00');
    return `<tr class="${past?'pastrow':''}">
      <td class="mt">
        <button class="lnk" onclick="BB.open('${m.id}')">${esc(m.adversaire||'Adversaire ?')}</button>
        <span class="sub">${isNaN(d)?esc(m.date):d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})} · ${esc(dom?'domicile':'extérieur')}</span>
      </td>
      <td class="num">${toHM(t.rdv)}<span class="sub">match ${toHM(toMin(m.heure))}</span></td>
      <td class="num">${(m.convoques||[]).length||'<span class="miss">0</span>'}${(m.absents||[]).length?`<span class="sub">${(m.absents||[]).length} abs.</span>`:''}</td>
      <td>${nm(dom?null:m.transport,nbTransport(m))}</td>
      <td>${nm(dom?m.bar:null,2)}</td>
      <td>${nm(m.lavage,1)}</td>
      <td>${(m.staff||[]).length?(m.staff||[]).map(id=>esc(coachName(id))).join(', '):'<span class="na">—</span>'}</td>
    </tr>`;
  }).join('');
  const c=counts(null);
  const tot=k=>S.matches.reduce((n,m)=>n+((m[k]||[]).length),0);
  return `
  <div class="row" style="margin-bottom:12px">
    <span class="tiny" style="flex:1">${ms.length} match${ms.length>1?'s':''} · ${tot('transport')} transports · ${tot('bar')} bars · ${tot('lavage')} lavages attribués</span>
    <button class="btn ghost sm" onclick="BB.exportMatches()">${I('down',16)} Exporter</button>
  </div>
  <div class="card">
    <div class="tbl-wrap">
      <table class="recap">
        <thead><tr>
          <th class="mt">Match</th><th>RDV</th><th>Joueurs</th>
          <th>${I('car',14)} Transport</th><th>${I('cup',14)} Bar</th>
          <th>${I('shirt',14)} Maillots</th><th>Coachs</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>
  <p class="tiny" style="margin-top:10px"><span class="only-tactile">Faites glisser le tableau horizontalement. </span>${COARSE?'Touchez':'Cliquez sur'} un adversaire pour ouvrir sa fiche.</p>`;
}

/* ---- équité ---- */
function equityView(){
  const c=counts(null), all=S.players.filter(p=>p.actif);
  const list=eligible().sort((a,b)=>(c[a.id].total-c[b.id].total)||a.nom.localeCompare(b.nom,'fr'));
  const exempts=all.filter(p=>!list.includes(p));
  const max=Math.max(1,...list.map(p=>c[p.id].total));
  const tot=list.reduce((s,p)=>s+c[p.id].total,0);
  const ecart=list.length?c[list[list.length-1].id].total-c[list[0].id].total:0;
  const cy=cycle(null);

  const kv=(cls,ic,v)=>`<span class="kv ${cls}${v?'':' z'}">${I(ic,14)}${v}</span>`;
  const rows=list.map(p=>{
    const k=c[p.id], w=x=>(x/max*100)+'%';
    return `<div class="brow">
      <span class="bname">${esc(p.prenom)} ${esc(p.nom)}<small>${k.convocs} convocation${k.convocs>1?'s':''}</small></span>
      <span class="bnums">${kv('tr','car',k.transport)}${kv('ba','cup',k.bar)}${kv('la','shirt',k.lavage)}<b class="btot">${k.total}</b></span>
      <span class="bars"><i class="b-tr" style="width:${w(k.transport)}"></i><i class="b-bar" style="width:${w(k.bar)}"></i><i class="b-lav" style="width:${w(k.lavage)}"></i></span>
    </div>`;
  }).join('');

  const etat = !tot ? 'Aucun tour attribué pour l\u2019instant.'
    : ecart===0 ? 'Répartition parfaitement équilibrée.'
    : ecart===1 ? 'Répartition équilibrée, un tour d\u2019écart au maximum.'
    : 'Écart de '+ecart+' tours entre la famille la plus et la moins sollicitée. Le bouton « Proposer » corrige de lui-même.';

  return `
  <div class="card"><div class="card-b">
    <h3 style="font-size:15px">Répartition des tours</h3>
    <div class="tiny" style="margin:3px 0 14px">${tot} tour${tot>1?'s':''} sur ${list.length} famille${list.length>1?'s':''} · ${esc(etat)}</div>
    ${rows||'<div class="tiny">Aucun joueur dans les roulements.</div>'}
    <div class="legend"><span><i class="b-tr"></i>Transport</span><span><i class="b-bar"></i>Bar</span><span><i class="b-lav"></i>Maillots</span></div>
  </div></div>

  ${cy.total?`<div class="card" style="margin-top:12px"><div class="card-b" style="display:flex;gap:12px;align-items:flex-start">
    ${I('shirt',20)}<div><b style="font-size:14.5px">Maillots — tour ${cy.tour}</b>
    <div class="tiny" style="margin-top:3px">${cy.total-cy.left.length} famille${cy.total-cy.left.length>1?'s':''} sur ${cy.total} ${cy.total-cy.left.length>1?'sont passées':'est passée'}${cy.left.length?'. Il reste : '+cy.left.map(id=>esc(pre(id))).join(', '):'. Tour complet, un nouveau démarre au prochain match.'}</div></div>
  </div></div>`:''}

const BB={
 go,

 /* -- premier démarrage -- */
 obNext(){

 },
 obBack(){

 },
 obSkip(msg){

 },
 /* Revoir le guide sans rien effacer, les données sont conservées. */

 open(id){view.tab='matchs';view.match=id;render();window.scrollTo(0,0)},
 expP(id){view.expP=view.expP===id?null:id;render()},
 expC(id){view.expC=view.expC===id?null:id;render()},

 /* non retenu → convoqué → absent → non retenu */
 cycleConv(pid){
   const m=S.matches.find(x=>x.id===view.match);
   m.convoques=m.convoques||[];m.absents=m.absents||[];
   const isC=m.convoques.includes(pid), isA=m.absents.includes(pid);
   m.convoques=m.convoques.filter(x=>x!==pid);
   m.absents=m.absents.filter(x=>x!==pid);
   if(!isC&&!isA)m.convoques.push(pid);
   else if(isC){
     m.absents.push(pid);
     ['transport','bar','lavage'].forEach(k=>{m[k]=(m[k]||[]).filter(x=>x!==pid)});
   }else{
     ['transport','bar','lavage'].forEach(k=>{m[k]=(m[k]||[]).filter(x=>x!==pid)});
   }
   save();render();
 },
 allConv(on){
   const av=snap();
   const m=S.matches.find(x=>x.id===view.match);
   const abs=new Set(m.absents||[]);
   m.convoques=on?S.players.filter(p=>p.actif&&!abs.has(p.id)).map(p=>p.id):[];
   if(!on)['transport','bar','lavage'].forEach(k=>m[k]=[]);
   save();render();
   if(!on)toast('Convocations et tours retirés','ban',av);
 },
 toggleTask(key,pid,n){
   const m=S.matches.find(x=>x.id===view.match);
   m[key]=m[key]||[];
   const i=m[key].indexOf(pid);
   if(i>=0)m[key].splice(i,1);
   else{m[key].push(pid);if(m[key].length>n)m[key].shift()}
   save();render();
 },
 toggleStaff(sid){
   const m=S.matches.find(x=>x.id===view.match);
   m.staff=m.staff||[];
   const i=m.staff.indexOf(sid);
   if(i<0)m.staff.push(sid);else m.staff.splice(i,1);
   save();render();
 },
 setNb(key,n){
   const m=S.matches.find(x=>x.id===view.match);
   m.nbTransport=n;
   if((m[key]||[]).length>n)m[key]=m[key].slice(-n);
   save();render();
 },
 auto(key,n){
   const m0=S.matches.find(x=>x.id===view.match);
   if(estPasse(m0)){toast('Match passé : à modifier à la main','ban');return}
   const av=snap();
   const m=m0;
   m[key]=suggest(m,key,n);save();render();
   toast('Proposé selon l\u2019équité','wand',av);
 },
 autoAll(){
   const m0=S.matches.find(x=>x.id===view.match);
   if(estPasse(m0)){toast('Match passé : à modifier à la main','ban');return}
   const av=snap();

   else{m.transport=[];m.lavage=[];m.transport=suggest(m,'transport',nbTransport(m))}
   m.lavage=suggest(m,'lavage',1);
   save();render();toast('Tours proposés','wand',av);
 },
 copyMsg(){
   const m=S.matches.find(x=>x.id===view.match);
   const ta=document.createElement('textarea');ta.value=msgOf(m);
   ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);
   ta.select();try{document.execCommand('copy')}catch(e){}

 },
 /* -- numéros de téléphone -- */
 numeros(){
   const st={portables:true,coachs:true,intl:false,sep:', '};
   const ov=sheet('Numéros pour le groupe WhatsApp',`<div id="nu"></div>`,()=>{},{noGuard:true});
   const box=ov.querySelector('#nu');

   const estPortable=v=>/^0\s*[67]/.test(String(v))||/^\+?33\s*[67]/.test(String(v));
   const inter=v=>{
     const d=String(v).replace(/[^\d+]/g,'');
     if(d.startsWith('+'))return d;
     if(d.startsWith('33'))return '+'+d;
     if(d.startsWith('0'))return '+33'+d.slice(1);
     return d;
   };
   function liste(){
     const out=[];
     const prendre=(src,qui)=>contacts(src).forEach(t=>{
       if(st.portables&&!estPortable(t.value))return;
       out.push({num:st.intl?inter(t.value):String(t.value).replace(/[\s.\-()]/g,''),
                 qui:qui+(t.label?' · '+t.label:'')});
     });
     S.players.filter(p=>p.actif).sort((a,b)=>a.nom.localeCompare(b.nom,'fr'))
       .forEach(p=>prendre(p.tels,p.prenom+' '+p.nom));
     if(st.coachs)S.staff.forEach(c=>prendre(c.tels,(c.prenom+' '+c.nom).trim()+' (coach)'));
     const vus=new Set(), uniq=[];
     out.forEach(o=>{const k=o.num.replace(/\D/g,'');if(k&&!vus.has(k)){vus.add(k);uniq.push(o)}});
     return uniq;
   }
   function draw(){
     const l=liste(), txt=l.map(o=>o.num).join(st.sep);
     box.innerHTML=`
     <div class="card"><div class="card-b">
       <p class="tiny" style="margin-bottom:14px">Copiez cette liste, puis collez-la dans le champ des participants au moment de créer le groupe. Les doublons sont retirés.</p>
       <label class="check"><input type="checkbox" data-o="portables"${st.portables?' checked':''}> Portables uniquement (06 et 07)</label>
       <label class="check"><input type="checkbox" data-o="coachs"${st.coachs?' checked':''}> Inclure les coachs</label>
       <label class="check" style="margin-bottom:14px"><input type="checkbox" data-o="intl"${st.intl?' checked':''}> Format international (+33)</label>
       <div class="f"><span>Séparateur</span>
         <div class="seg mini" style="width:100%">
           <button type="button" data-s=", " aria-pressed="${st.sep===', '}">virgule</button>
           <button type="button" data-s=" ; " aria-pressed="${st.sep===' ; '}">point-virgule</button>
           <button type="button" data-s="\n" aria-pressed="${st.sep==='\n'}">une par ligne</button>
         </div>
       </div>
       <label class="f"><span>${l.length} numéro${l.length>1?'s':''}</span>
         <textarea id="nu_t" readonly style="min-height:150px;font-family:ui-monospace,Menlo,monospace">${esc(txt)}</textarea></label>
       <button class="btn wide" data-c="1"${l.length?'':' disabled'}>${I('copy',18)} Copier les ${l.length} numéros</button>
     </div></div>
     <div class="sec-title">${I('users',17)} Détail</div>
     <div class="card">${l.length?l.map(o=>`<div class="prow" style="min-height:52px">
         <span class="grow"><span class="name" style="font-size:14px">${esc(o.qui)}</span></span>
         <span class="tiny" style="font-variant-numeric:tabular-nums">${esc(o.num)}</span>
       </div>`).join(''):'<div class="empty">Aucun numéro ne correspond à ces critères.</div>'}</div>`;

     box.querySelectorAll('[data-o]').forEach(c=>c.onchange=()=>{st[c.dataset.o]=c.checked;draw()});
     box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{st.sep=b.dataset.s;draw()});
     const cp=box.querySelector('[data-c]');
     if(cp)cp.onclick=()=>{
       const ta=box.querySelector('#nu_t');
       ta.removeAttribute('readonly');ta.select();
       try{document.execCommand('copy')}catch(e){}
       ta.setAttribute('readonly','');
       toast(l.length+' numéros copiés','check');
     };
   }
   draw();
 },

 },
 resetMsg(){

 },
 openThen(id,act){

 },
 ics(id){
   const list=id?[S.matches.find(x=>x.id===id)]:sortedMatches();

   const txt=buildIcs(list);

     toast(id?'Événement téléchargé':'Calendrier téléchargé','check');
   }catch(e){toast('Téléchargement impossible')}
 },
 /* -- matchs -- */
 editMatch(id){
   const def=S.settings.salleDef;
   const m=id?S.matches.find(x=>x.id===id)
             :{date:'',heure:'',adversaire:'',lieu:'domicile',salle:def,adresse:salleAdr(def),depart:def,trajet:''};
   const dom=m.lieu==='domicile';
   sheet(id?'Modifier le match':'Nouveau match',`
     <div class="card"><div class="card-b">
       <div class="grid2">
         <label class="f"><span>Date</span><input id="m_d" type="date" value="${esc(m.date)}"></label>
         <label class="f"><span>Heure du match</span><input id="m_h" type="time" step="300" value="${esc(normHeure(m.heure))}"></label>
       </div>
       <label class="f"><span>Adversaire</span><input id="m_a" value="${esc(m.adversaire)}" placeholder="BC Vertou"></label>
       <div class="f"><span>Lieu</span>
         <div class="seg lieu" id="m_seg">
           <button type="button" data-v="domicile" aria-pressed="${dom}">${I('home',17)} À domicile</button>
           <button type="button" data-v="exterieur" aria-pressed="${!dom}">${I('car',17)} À l'extérieur</button>
         </div>
       </div>
       <div id="m_bdom" style="${dom?'':'display:none'}">
         <label class="f"><span>Salle qui reçoit</span>${salleField('m_ss',dom?m.salle:def,'Nom de votre salle')}</label>
       </div>
       <div id="m_bext" style="${dom?'display:none':''}">
         <label class="f"><span>Adresse du match — sert au calcul du trajet</span>
           <input id="m_ad" value="${esc(dom?'':(m.adresse||''))}" placeholder="Rue du Loiry, 44120 Vertou"></label>
         <label class="f"><span>Salle de l'adversaire</span><input id="m_s" value="${esc(dom?'':(m.salle||''))}" placeholder="Salle du Loiry"></label>
         <label class="f"><span>Départ groupé depuis</span>${salleField('m_dp',m.depart||def,'Nom de votre salle')}</label>
         <div id="m_hint"></div>
         <label class="f" style="margin-bottom:4px"><span>Trajet aller (min)</span>
           <input id="m_t" type="number" min="0" step="5" value="${m.trajet||''}" placeholder="—"></label>
         <div class="row" style="gap:16px;margin-bottom:14px">
           <button class="link subtle" id="m_est">${I('refresh',15)} Recalculer</button>
           <button class="link subtle" id="m_map">${I('map',15)} Google Maps</button>
         </div>
       </div>
       <button class="btn wide" id="m_ok">${id?'Enregistrer':'Ajouter le match'}</button>
     </div></div>`,ov=>{
       const q=s=>ov.querySelector(s);
       const lieuVal=()=>q('#m_seg button[aria-pressed="true"]').dataset.v;
       q('#m_seg').querySelectorAll('button').forEach(b=>{
         b.onclick=()=>{
           q('#m_seg').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
           const d=b.dataset.v==='domicile';
           q('#m_bdom').style.display=d?'':'none';
           q('#m_bext').style.display=d?'none':'';
           if(!d)propose(false);
         };
       });
       let depTouched=!!id;   /* sur un match existant, on respecte le départ enregistré */
       function propose(force){
         const dest=q('#m_ad').value.trim();
         if(!dest){
           q('#m_hint').innerHTML=force?'<div class="warn">Renseignez l\u2019adresse du match pour estimer le trajet.</div>':'';
           return;
         }
         /* on estime le trajet depuis chacune des salles à domicile ; sans salle
            enregistrée, depuis le point de départ tapé à la main */
         const src=salles().length?salles().map(x=>x.nom):[q('#m_dp').value.trim()].filter(Boolean);
         const opts=src.map(nom=>({nom:nom,e:estimTrajet(nom,dest,id)}))
                       .filter(o=>o.e).sort((a,b)=>a.e.min-b.e.min);
         if(!opts.length){
           q('#m_hint').innerHTML=force?'<div class="warn">Commune non reconnue dans l\u2019adresse, saisissez la durée du trajet à la main.</div>':'';
           return;
         }
         const best=opts[0];
         if((force||!depTouched)&&q('#m_dp').value!==best.nom)q('#m_dp').value=best.nom;
         const cur=opts.find(o=>o.nom===q('#m_dp').value)||best;
         if(force||!q('#m_t').value)q('#m_t').value=cur.e.min;
         const h=toMin(q('#m_h').value), av=+S.settings.avant||45;
         const dep=h==null?null:h-av-cur.e.min;
         const others=opts.filter(o=>o.nom!==cur.nom);
         const meilleur=cur.nom===best.nom;
         q('#m_hint').innerHTML=`
           <div class="hintbox${meilleur?'':' alt'}">
             ${I('route',17)}
             <div style="flex:1;min-width:0">
               <b>${meilleur?'Départ conseillé':'Trajet depuis'} : ${esc(cur.nom)} — ${cur.e.min} min</b>
               <div class="sub">${esc(cur.e.why)}${dep!=null?' · départ à '+toHM(dep)+' pour être sur place '+av+' min avant':''}</div>
               ${others.length?`<div class="sub alts">${others.map(o=>esc(o.nom)+' '+o.e.min+' min').join(' · ')}</div>`:''}
               ${meilleur?'':`<button class="btn sm ghost" id="m_use" style="margin-top:9px">${I('check',15)} Partir plutôt de ${esc(best.nom)} (${best.e.min} min)</button>`}
             </div>
           </div>`;
         const u=q('#m_use');
         if(u)u.onclick=e2=>{e2.preventDefault();q('#m_dp').value=best.nom;depTouched=true;propose(true)};
       }
       q('#m_est').onclick=e=>{e.preventDefault();propose(true)};
       q('#m_map').onclick=e=>{
         e.preventDefault();
         const u=mapsUrl({lieu:lieuVal(),adresse:q('#m_ad').value.trim(),
                          salle:q('#m_s').value.trim(),depart:q('#m_dp').value});
         if(!u){toast('Renseignez l\u2019adresse du match');return}
         window.open(u,'_blank');
       };
       q('#m_ad').addEventListener('change',()=>propose(false));
       q('#m_dp').addEventListener('change',()=>{depTouched=true;propose(true)});
       q('#m_h').addEventListener('change',()=>{if(lieuVal()!=='domicile')propose(false)});
       if(!dom)propose(false);
       q('#m_ok').onclick=()=>{
         const g=s=>q(s).value.trim(), d=lieuVal()==='domicile';
         if(!g('#m_d')||!g('#m_h')){toast('Date et heure obligatoires');return}
         /* une salle saisie librement rejoint les réglages */
         const sd=registerSalle(d?g('#m_ss'):g('#m_dp'));
         const o=d?{date:g('#m_d'),heure:normHeure(g('#m_h')),adversaire:g('#m_a'),lieu:'domicile',
                    salle:sd,adresse:salleAdr(sd),depart:sd,trajet:0}
                 :{date:g('#m_d'),heure:normHeure(g('#m_h')),adversaire:g('#m_a'),lieu:'exterieur',
                    salle:g('#m_s'),adresse:g('#m_ad'),depart:sd,trajet:+g('#m_t')||0};
         if(id)Object.assign(S.matches.find(x=>x.id===id),o);
         else{
           const nm=Object.assign({id:uid(),convoques:[],transport:[],bar:[],lavage:[],staff:S.staff.map(x=>x.id)},o);
           S.matches.push(nm);
           /* on ouvre directement la fiche du match créé */
           view.tab='matchs';view.match=nm.id;
         }
         save();ov.remove();render();
         if(!id){window.scrollTo(0,0);toast('Match créé, à vous les convocations','check')}
       };
     });
 },
 maps(id){
   const u=mapsUrl(S.matches.find(x=>x.id===id));
   if(!u){toast('Aucune adresse renseignée');return}
   window.open(u,'_blank');
 },
 delMatch(id){
   const m=S.matches.find(x=>x.id===id);

 /* -- planification multi-matchs -- */
 plan(){
   const today=new Date().toISOString().slice(0,10);
   const dispo=sortedMatches().filter(m=>(m.date||'')>=today);
   if(!dispo.length){toast('Aucun match à venir');return}
   const st={
     ids:new Set(dispo.filter(m=>!isReady(m)).map(m=>m.id)),
     tasks:{transport:true,bar:true,lavage:true},
     mode:'fill', convoquer:false
   };
   if(!st.ids.size)dispo.forEach(m=>st.ids.add(m.id));

   const ov=sheet('Planifier plusieurs matchs',`<div id="pl"></div>`,()=>{});
   const box=ov.querySelector('#pl');

   function draw(){
     const ids=[...st.ids];
     const res=ids.length?planCompute(ids,st.tasks,st.mode,st.convoquer):null;
     const cl=res&&res.clone;
     const nm=(a,n)=>!a||!a.length?'<span class="miss">—</span>'
       :a.map(id=>esc(pre(id))).join(', ')+(a.length<n?' <span class="miss">+'+(n-a.length)+'</span>':'');
     const lignes=cl?res.ordre.map(id=>{
       const m=cl.matches.find(x=>x.id===id), o=S.matches.find(x=>x.id===id), dom=m.lieu==='domicile';
       const chg=k=>((m[k]||[]).join()!==((o&&o[k])||[]).join())?' class="chg"':'';
       const d=new Date(m.date+'T12:00:00');
       return `<tr>
         <td class="mt"><b>${esc(m.adversaire||'?')}</b><span class="sub">${isNaN(d)?'':d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})} · ${dom?'dom.':'ext.'}</span></td>
         <td${chg(dom?'bar':'transport')}>${dom?nm(m.bar,2):nm(m.transport,nbTransport(m))}</td>
         <td${chg('lavage')}>${nm(m.lavage,1)}</td>
       </tr>`;
     }).join(''):'';

     /* équité obtenue après application */
     let bilan='';
     if(cl){
       const back=S;S=cl;const c=counts(null);S=back;
       const el=eligible().map(p=>c[p.id].total);
       if(el.length)bilan=`Après application : écart de ${Math.max(...el)-Math.min(...el)} tour(s) entre familles.`;
     }

     box.innerHTML=`
     <div class="card"><div class="card-b">
       <div class="f"><span>Matchs concernés — ${st.ids.size} sur ${dispo.length}</span>
         <div class="row" style="gap:14px;margin-bottom:8px">
           <button class="link subtle" data-act="all">Tous</button>
           <button class="link subtle" data-act="none">Aucun</button>
           <button class="link subtle" data-act="todo">Ceux à compléter</button>
         </div>
         <div class="pllist">${dispo.map(m=>{
           const d=new Date(m.date+'T12:00:00');
           return `<label class="plitem"><input type="checkbox" data-id="${m.id}"${st.ids.has(m.id)?' checked':''}>
             <span><b>${esc(m.adversaire||'?')}</b><span class="sub">${isNaN(d)?'':d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'})} · ${m.lieu==='domicile'?'domicile':'extérieur'}${isReady(m)?' · complet':''}</span></span></label>`;
         }).join('')}</div>
       </div>
       <div class="f"><span>Tours à attribuer</span>
         <div class="chips">
           <button class="chip" data-task="transport" data-on="${st.tasks.transport?1:0}">${I('car',15)} Transport</button>
           <button class="chip" data-task="bar" data-on="${st.tasks.bar?1:0}">${I('cup',15)} Bar</button>
           <button class="chip" data-task="lavage" data-on="${st.tasks.lavage?1:0}">${I('shirt',15)} Maillots</button>
         </div>
       </div>
       <div class="f"><span>Méthode</span>
         <div class="seg meth">
           <button type="button" data-mode="fill" aria-pressed="${st.mode==='fill'}">${I('plus',16)} Compléter</button>
           <button type="button" data-mode="all" aria-pressed="${st.mode==='all'}">${I('refresh',16)} Tout refaire</button>
         </div>
         <p class="tiny" style="margin-top:7px">${st.mode==='fill'
           ?'Les désignations déjà faites sont conservées, seules les places vides sont pourvues.'
           :'Les désignations existantes sont effacées et recalculées.'}</p>
       </div>
       <label class="check" style="margin-bottom:4px"><input type="checkbox" data-conv${st.convoquer?' checked':''}> Convoquer tout l'effectif si aucun joueur n'est convoqué</label>
     </div></div>

     <div class="sec-title">${I('scale',17)} Aperçu</div>
     <div class="card">
       ${st.ids.size?`<div class="tbl-wrap"><table class="recap plprev">
         <thead><tr><th class="mt">Match</th><th>Transport / Bar</th><th>${I('shirt',14)} Maillots</th></tr></thead>
         <tbody>${lignes}</tbody></table></div>`
        :'<div class="empty">Sélectionnez au moins un match.</div>'}
     </div>
     ${bilan?`<p class="tiny" style="margin-top:9px">${esc(bilan)} Les lignes surlignées sont celles qui changent.</p>`:''}
     <button class="btn wide" style="margin-top:14px" data-act="apply"${st.ids.size?'':' disabled'}>${I('check',18)} Appliquer à ${st.ids.size} match${st.ids.size>1?'s':''}</button>`;

     box.querySelectorAll('input[type=checkbox][data-id]').forEach(cb=>{
       cb.onchange=()=>{cb.checked?st.ids.add(cb.dataset.id):st.ids.delete(cb.dataset.id);draw()};
     });
     box.querySelectorAll('[data-task]').forEach(b=>{
       b.onclick=()=>{st.tasks[b.dataset.task]=!st.tasks[b.dataset.task];draw()};
     });
     box.querySelectorAll('[data-mode]').forEach(b=>{
       b.onclick=()=>{st.mode=b.dataset.mode;draw()};
     });
     const cv=box.querySelector('[data-conv]');
     if(cv)cv.onchange=()=>{st.convoquer=cv.checked;draw()};
     box.querySelectorAll('[data-act]').forEach(b=>{
       b.onclick=()=>{
         const a=b.dataset.act;
         if(a==='all'){dispo.forEach(m=>st.ids.add(m.id));draw()}
         else if(a==='none'){st.ids.clear();draw()}
         else if(a==='todo'){st.ids.clear();dispo.filter(m=>!isReady(m)).forEach(m=>st.ids.add(m.id));draw()}
         else if(a==='apply'){
           const avantPlan=snap();
           const r=planCompute([...st.ids],st.tasks,st.mode,st.convoquer);
           r.ordre.forEach(id=>{
             const src=r.clone.matches.find(x=>x.id===id), dst=S.matches.find(x=>x.id===id);
             if(!src||!dst)return;
             ['convoques','absents','transport','bar','lavage'].forEach(k=>dst[k]=(src[k]||[]).slice());
           });
           save();ov.remove();render();
           toast(r.ordre.length+' match'+(r.ordre.length>1?'s planifiés':' planifié'),'check',avantPlan);
         }
       };
     });
   }
   draw();
 },

 importMatches(){
   sheet('Importer un calendrier',`
   <div class="card"><div class="card-b">
     ${dzHtml('dz_m','Excel (.xlsx), CSV ou TSV — ou '+tap+' pour parcourir')}
     <button class="btn ghost wide" style="margin-top:10px" onclick="BB.gabarit()">${I('file')} Télécharger le gabarit Excel</button>
     <p class="tiny" style="margin:14px 0 8px">Colonnes attendues :<br>
       Date (jj/mm/aaaa) · Heure · Adversaire · D ou E · Salle · Adresse · Trajet (min)<br>
       Salle à domicile : ${salles().length?salles().map(x=>esc(x.nom)).join(', '):'aucune salle enregistrée pour l’instant, elle sera créée à l’import'}. Trajet vide = estimé automatiquement.</p>
     <label class="f"><span>Ou collez vos lignes copiées depuis Excel</span>
       <textarea id="c_t" placeholder="14/09/2026&#9;14h00&#9;BC Vertou&#9;E&#9;Salle du Loiry&#9;Vertou&#9;"></textarea></label>
     <button class="btn wide" id="c_ok">${I('up',18)} Importer</button>
   </div></div>`,ov=>{
     let rows=null;
     dropZone('dz_m','matchs',r=>{rows=r});
     ov.querySelector('#c_ok').onclick=()=>{
       const r=rows||splitLines(ov.querySelector('#c_t').value);
       if(!r||!r.length){toast('Rien à importer');return}
       let n=0;
       r.forEach((c,i)=>{
         if(i===0&&/date/i.test(c[0]||''))return;
         const d=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((c[0]||'').trim());
         const iso=d?`${d[3]}-${d[2].padStart(2,'0')}-${d[1].padStart(2,'0')}`
                   :(/^\d{4}-\d{2}-\d{2}$/.test((c[0]||'').trim())?c[0].trim():null);
         if(!iso)return;
         const ext=/^e/i.test((c[3]||'').trim());
         const sal=(c[4]||'').trim();
         /* Une salle à domicile encore inconnue est créée au passage : le calendrier
            s'importe avant même d'avoir rempli les réglages. */
         const home=ext?'':(registerSalle(sal)||S.settings.salleDef);
         const m={id:uid(),date:iso,heure:normHeure(c[1]||''),adversaire:(c[2]||'').trim(),
           lieu:ext?'exterieur':'domicile',
           salle:ext?sal:home,
           adresse:ext?(c[5]||'').trim():salleAdr(home),
           depart:ext?(S.settings.salleDef||home):home,
           trajet:ext?(+(c[6]||0)||0):0,
           convoques:[],transport:[],bar:[],lavage:[],staff:S.staff.map(x=>x.id)};
         if(ext&&!m.trajet){
           const e=estimTrajet(m.depart,m.adresse);
           if(e)m.trajet=e.min;
         }
         S.matches.push(m);n++;
       });
       if(!n){toast('Aucune date reconnue');return}
       save();ov.remove();render();toast(n+' match(s) importé(s)','check');
     };
   });
 },
